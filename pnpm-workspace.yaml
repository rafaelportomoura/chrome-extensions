# vitest > vite > tinyglobby, so it never reaches a built extension.
# Expected fix: picomatch merges PR #194 (micromatch/picomatch) and publishes a release above 4.0.7.
# Retry by 2026-11-24: if a patched version exists, upgrade (or override to it) and delete this
# entry; otherwise re-check and move the date a week forward.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
